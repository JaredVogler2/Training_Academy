<!doctype html>
<html lang="en" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6dbdea" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Training Academy: a gentle learning adventure for preschoolers. Plays in the browser, saves on this device, no accounts and no ads."
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Academy" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Training Academy</title>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-mark" aria-hidden="true"></div>
        <p class="boot-late">
          Still getting ready. If nothing appears, the browser on this phone or tablet may be too
          old for the game: updating the device usually fixes it.
        </p>
      </div>
    </div>
    <noscript>
      <p class="noscript">Training Academy needs JavaScript switched on to run.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
