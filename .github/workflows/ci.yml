name: CI

# Every pull request, and every push to main:
#   verify    formatting, lint, types, unit tests, the production build and its release checks
#   browsers  the Playwright suite against that build, on Chromium and on WebKit (Safari's engine)
#
# WebKit here is a desktop Linux build driven by Playwright. It is evidence about the engine, not about an iPhone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The build as it would be served: whole, lean, strict-CSP-safe, with the 3D code out of the first load.
      - run: npm run verify:dist

  browsers:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each engine's screens are shared between two jobs. With six worlds the suite is twice what it was, and
        # one job for an engine would run close to the time limit on a machine that runs two tests at a time.
        #
        # The desktop screen has every test and is two thirds of Chromium's work by itself, so it shares a job
        # with the tablet only. (With the two small phones as well, that job reached 31.7 of its 40 minutes once
        # an activity that shows something first could no longer be answered early.) And it is itself in two
        # halves: it is the screen every activity is played to its end on, a question that is listened to takes
        # as long as it takes to hear, and with the Music Lab the one job took 29 minutes. Playwright deals the
        # tests of the two screens between the halves.
        #
        # The phones are in two halves as well. The phone screen is where everything a child presses is measured,
        # on each kind of board at each of the tightest screens, and with that the one job took 32.5 minutes.
        include:
          - name: chromium, desktop and tablet, first half
            engine: chromium
            projects: >-
              --project=desktop --project=tablet --shard=1/2
          - name: chromium, desktop and tablet, second half
            engine: chromium
            projects: >-
              --project=desktop --project=tablet --shard=2/2
          - name: chromium, phones, first half
            engine: chromium
            projects: >-
              --project=phone --project=small-phone --project=phone-landscape
              --project=android --project=android-landscape --shard=1/2
          - name: chromium, phones, second half
            engine: chromium
            projects: >-
              --project=phone --project=small-phone --project=phone-landscape
              --project=android --project=android-landscape --shard=2/2
          - name: webkit, desktop and tablet
            engine: webkit
            projects: >-
              --project=webkit-desktop --project=ipad
          # WebKit's phones are in two halves too. As one job they took 28.8 of the 40 minutes with Reading
          # Cove's later activities in, and "how to play" is shown in real time on every one of these screens.
          - name: webkit, phones, first half
            engine: webkit
            projects: >-
              --project=webkit-phone --project=iphone --project=iphone-landscape --shard=1/2
          - name: webkit, phones, second half
            engine: webkit
            projects: >-
              --project=webkit-phone --project=iphone --project=iphone-landscape --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Timings in these tests depend on the machine; say what it is, so a slow run can be read for what it is.
      - name: Describe the runner
        run: echo "$(nproc) CPU cores, $(awk '/MemTotal/ {printf "%.0f", $2 / 1048576}' /proc/meminfo) GB of memory"
      - run: npx playwright test ${{ matrix.projects }}
        env:
          PW_WEBKIT: ${{ matrix.engine == 'webkit' && '1' || '0' }}
      # Kept whenever the tests ran, not only when they failed: a test that passed at its second attempt leaves a
      # trace of that attempt, and that is the only evidence of what went wrong the first time.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ strategy.job-index }}-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
