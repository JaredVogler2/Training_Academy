name: CI

# Every pull request, and every push to main:
#   verify    formatting, lint, types, unit tests, the production build and its release checks
#   browsers  the Playwright suite against that build, on Chromium and on WebKit (Safari's engine)
#
# WebKit here is a desktop Linux build driven by Playwright. It is evidence about the engine, not about an iPhone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The build as it would be served: whole, lean, strict-CSP-safe, with the 3D code out of the first load.
      - run: npm run verify:dist

  browsers:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Each engine's screens are shared between several jobs, and each of those is dealt out in parts by
        # Playwright (--shard). A part should need about half of the forty minutes at most, because the forty
        # also have to cover getting the browser and what it needs onto the machine, and that is not always
        # quick: it is usually half a minute, and it has taken 5, 13 and 17 minutes when the mirror a runner was
        # given for Ubuntu's packages was slow. The job whose tests take 23 minutes was cancelled at its limit
        # by the seventeen, with 566 of its 567 tests done and none failed.
        #
        # How the parts came about. The desktop screen has every test and is two thirds of Chromium's work, so
        # it shares its jobs with the tablet only. As one job that took 29 minutes with the Music Lab; as two,
        # 25 and 18 with Robot Ridge's longer plans; it is three now. The phone screen is where everything a
        # child presses is measured, on each kind of board at each of the tightest screens: as one job the
        # phones took 32.5 minutes; as two, 22 and 29; they are three now. WebKit's phones took 28.8 as one job
        # and are two. WebKit's desktop and tablet took 23.5 as one job, and are two.
        include:
          - name: chromium, desktop and tablet, part 1 of 3
            engine: chromium
            projects: >-
              --project=desktop --project=tablet --shard=1/3
          - name: chromium, desktop and tablet, part 2 of 3
            engine: chromium
            projects: >-
              --project=desktop --project=tablet --shard=2/3
          - name: chromium, desktop and tablet, part 3 of 3
            engine: chromium
            projects: >-
              --project=desktop --project=tablet --shard=3/3
          - name: chromium, phones, part 1 of 3
            engine: chromium
            projects: >-
              --project=phone --project=small-phone --project=phone-landscape
              --project=android --project=android-landscape --shard=1/3
          - name: chromium, phones, part 2 of 3
            engine: chromium
            projects: >-
              --project=phone --project=small-phone --project=phone-landscape
              --project=android --project=android-landscape --shard=2/3
          - name: chromium, phones, part 3 of 3
            engine: chromium
            projects: >-
              --project=phone --project=small-phone --project=phone-landscape
              --project=android --project=android-landscape --shard=3/3
          - name: webkit, desktop and tablet, first half
            engine: webkit
            projects: >-
              --project=webkit-desktop --project=ipad --shard=1/2
          - name: webkit, desktop and tablet, second half
            engine: webkit
            projects: >-
              --project=webkit-desktop --project=ipad --shard=2/2
          - name: webkit, phones, first half
            engine: webkit
            projects: >-
              --project=webkit-phone --project=iphone --project=iphone-landscape --shard=1/2
          - name: webkit, phones, second half
            engine: webkit
            projects: >-
              --project=webkit-phone --project=iphone --project=iphone-landscape --shard=2/2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser, and the packages of Ubuntu's that it needs. Nearly all of the time this takes is the
      # packages, and where it was slow that was where: 139 MB at 133 kB a second, once.
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      # Timings in these tests depend on the machine; say what it is, so a slow run can be read for what it is.
      - name: Describe the runner
        run: echo "$(nproc) CPU cores, $(awk '/MemTotal/ {printf "%.0f", $2 / 1048576}' /proc/meminfo) GB of memory"
      - run: npx playwright test ${{ matrix.projects }}
        env:
          PW_WEBKIT: ${{ matrix.engine == 'webkit' && '1' || '0' }}
      # Kept whenever the tests ran, not only when they failed: a test that passed at its second attempt leaves a
      # trace of that attempt, and that is the only evidence of what went wrong the first time.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-${{ strategy.job-index }}-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
